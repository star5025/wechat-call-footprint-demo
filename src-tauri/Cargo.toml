[package]
name = "call-footprint"
version = "0.5.0"
description = "Local-first personal call footprint desktop app"
authors = ["1star"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "call_footprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }
aes = "0.8"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
zeroize = "1.8"
zstd = "0.13"
chrono = { version = "0.4", features = ["clock"] }
rayon = "1.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
