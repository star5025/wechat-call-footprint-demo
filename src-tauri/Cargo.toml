[package]
name = "call-footprint"
version = "0.4.0"
description = "Local-first personal call footprint desktop app"
authors = ["1star"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "call_footprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
