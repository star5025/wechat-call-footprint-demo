name: Pages demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build Pages demo
        run: npm run build:pages

      - name: Verify public artifacts and stamp commit metadata
        run: node scripts/check-pages-build.mjs

      - name: Install temporary cloud smoke dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          npx --no-install playwright install --with-deps chromium

      - name: Smoke test in cloud headless Chromium
        run: node scripts/pages-smoke.mjs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    name: Deploy Pages demo
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
